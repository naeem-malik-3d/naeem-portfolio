<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Lead Triage Agent — Naeem Malik</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0;background:#0c0a09;font-family:sans-serif;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

const SAMPLES = [
  { label: 'Hot lead', text: "Hi, I run a boutique hotel in Goa and need 200 custom-branded welcome kits with our logo, delivered within 3 weeks. Budget is around ₹1.5L. Can you share pricing?" },
  { label: 'Support complaint', text: "I ordered 500 diaries last month (Order #4471) and 40 of them arrived with the logo printed upside down. This is the second time. I need a replacement urgently." },
  { label: 'Low-intent', text: "hello sir do you provide seo services and website design also crypto trading course available? reply fast" },
];

function Badge({ children, tone }) {
  const tones = { high: 'bg-rose-500/15 text-rose-400 border-rose-500/30', medium: 'bg-amber-500/15 text-amber-400 border-amber-500/30', low: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30', neutral: 'bg-stone-700/40 text-stone-300 border-stone-600/40' };
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-full border text-[11px] font-medium ${tones[tone]||tones.neutral}`}>{children}</span>;
}

function App() {
  const [apiKey, setApiKey] = useState('');
  const [showKeyInput, setShowKeyInput] = useState(true);
  const [inquiry, setInquiry] = useState(SAMPLES[0].text);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  const analyze = async () => {
    if (!inquiry.trim()) return;
    if (!apiKey.trim()) { setError('Enter your Anthropic API key above to run this demo live.'); return; }
    setLoading(true); setError(''); setResult(null);

    const systemPrompt = `You are an AI automation node inside a business workflow. Respond ONLY with valid JSON, no markdown fences:
{"category":"New Sales Lead|Support / Complaint|Vendor / Partnership|Spam / Low Intent","urgency":"high|medium|low","extracted":{"customer_need":"","quantity_or_scope":null,"budget_mentioned":null,"deadline_mentioned":null},"routing":"","draft_reply":""}`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: systemPrompt, messages: [{ role: 'user', content: inquiry }] }),
      });
      const data = await response.json();
      if (data.error) { setError(data.error.message || 'API error'); setLoading(false); return; }
      const textBlock = data.content?.find((b) => b.type === 'text')?.text || '';
      const clean = textBlock.replace(/```json|```/g, '').trim();
      setResult(JSON.parse(clean));
    } catch (e) {
      setError('Could not reach the API — check your key or CORS settings.');
    } finally { setLoading(false); }
  };

  const urgencyTone = (u) => (u === 'high' ? 'high' : u === 'medium' ? 'medium' : 'low');

  return (
    <div className="min-h-screen w-full bg-stone-950 text-stone-100">
      <div className="max-w-md mx-auto px-4 py-6 pb-14">
        <div className="text-amber-500 text-[11px] uppercase tracking-wide font-semibold mb-1">AI Automation Demo</div>
        <h1 className="text-[24px] text-stone-50 mb-1" style={{fontFamily:"Georgia, serif"}}>Lead Triage & Auto-Responder</h1>
        <p className="text-[12.5px] text-stone-500 mb-4">Raw customer inquiry in → AI classifies, extracts data, drafts a reply, and routes it.</p>

        <div className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 mb-4 text-[12px] text-amber-300">
          This is a live demo — enter your own Anthropic API key (from console.anthropic.com) to run it. The key stays in your browser only, nothing is stored or sent anywhere except Anthropic's API.
        </div>
        <input type="password" value={apiKey} onChange={(e)=>setApiKey(e.target.value)} placeholder="sk-ant-... (your Anthropic API key)"
          className="w-full bg-stone-900/60 border border-stone-700/60 rounded-md px-3 py-2.5 text-stone-100 text-[13px] outline-none mb-4 focus:border-amber-500/70" />

        <div className="flex flex-wrap gap-1.5 mb-3">
          {SAMPLES.map((s) => (
            <button key={s.label} onClick={() => { setInquiry(s.text); setResult(null); }}
              className="text-[11px] px-2.5 py-1 rounded-full border border-stone-700 text-stone-400 hover:border-amber-500/50 hover:text-amber-400">{s.label}</button>
          ))}
        </div>

        <div className="bg-stone-900/40 border border-stone-800 rounded-lg p-3 mb-3">
          <textarea value={inquiry} onChange={(e)=>setInquiry(e.target.value)} rows={5}
            className="w-full bg-transparent text-stone-100 text-[13.5px] outline-none resize-none" />
        </div>

        <button onClick={analyze} disabled={loading}
          className="w-full bg-amber-500 hover:bg-amber-400 disabled:bg-stone-700 text-stone-950 font-semibold text-[14px] py-2.5 rounded-md mb-5">
          {loading ? 'Running...' : 'Analyze & Draft Reply'}
        </button>

        {error && <div className="text-rose-400 text-[13px] mb-4">{error}</div>}

        {result && (
          <div className="space-y-3">
            <div className="flex gap-2 flex-wrap">
              <Badge tone="neutral">{result.category}</Badge>
              <Badge tone={urgencyTone(result.urgency)}>{result.urgency.toUpperCase()} urgency</Badge>
            </div>
            <div className="bg-stone-900/40 border border-stone-800 rounded-lg p-3.5">
              <div className="text-[11px] uppercase text-stone-500 mb-2">Extracted Info</div>
              <div className="text-[13px] space-y-1">
                <div><span className="text-stone-500">Need:</span> {result.extracted?.customer_need}</div>
                {result.extracted?.budget_mentioned && <div><span className="text-stone-500">Budget:</span> {result.extracted.budget_mentioned}</div>}
              </div>
            </div>
            <div className="bg-stone-900/40 border border-stone-800 rounded-lg p-3.5">
              <div className="text-[11px] uppercase text-stone-500 mb-2">Routing</div>
              <div className="text-[13.5px]">{result.routing}</div>
            </div>
            <div className="bg-gradient-to-b from-stone-900 to-stone-900/60 border border-amber-500/20 rounded-lg p-3.5">
              <div className="text-[11px] uppercase text-amber-500 mb-2">Draft Reply</div>
              <div className="text-[13.5px] whitespace-pre-wrap">{result.draft_reply}</div>
            </div>
          </div>
        )}
        <p className="text-[10.5px] text-stone-600 mt-6">Built by Naeem Malik — designed to mirror an n8n/Make automation node.</p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
