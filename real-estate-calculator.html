<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Property Investment Calculator — Naeem Malik</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0c0a09;font-family:'Inter',sans-serif;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const UNIT_TO_SQFT = { sqft: 1, sqgaj: 9, sqm: 10.7639 };
const UNIT_LABEL = { sqft: 'sq ft', sqgaj: 'sq gaj (yard)', sqm: 'sq meter' };

function formatINR(num) {
  if (!isFinite(num)) return '₹0';
  const n = Math.round(num);
  const isNeg = n < 0;
  const abs = Math.abs(n);
  let str;
  if (abs >= 10000000) str = (abs / 10000000).toFixed(2) + ' Cr';
  else if (abs >= 100000) str = (abs / 100000).toFixed(2) + ' L';
  else str = abs.toLocaleString('en-IN');
  return (isNeg ? '-₹' : '₹') + str;
}
function formatFull(num) {
  if (!isFinite(num)) return '₹0';
  return '₹' + Math.round(num).toLocaleString('en-IN');
}

function Field({ label, children, hint }) {
  return (
    <label className="block">
      <span className="block text-[13px] font-medium text-stone-300 mb-1.5">{label}</span>
      {children}
      {hint && <span className="block mt-1 text-[11px] text-stone-500">{hint}</span>}
    </label>
  );
}
function NumInput({ value, onChange, suffix }) {
  return (
    <div className="relative">
      <input type="number" inputMode="decimal" value={value} onChange={(e) => onChange(e.target.value)}
        className="w-full bg-stone-900/60 border border-stone-700/60 rounded-md px-3 py-2.5 text-stone-100 text-[15px] outline-none focus:border-amber-500/70" />
      {suffix && <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[12px] text-stone-500">{suffix}</span>}
    </div>
  );
}
function SegToggle({ options, value, onChange }) {
  return (
    <div className="inline-flex rounded-md bg-stone-900/60 border border-stone-700/60 p-0.5 gap-0.5">
      {options.map((opt) => (
        <button key={opt.value} type="button" onClick={() => onChange(opt.value)}
          className={`px-2.5 py-1 text-[12px] rounded ${value === opt.value ? 'bg-amber-500 text-stone-950 font-semibold' : 'text-stone-400'}`}>
          {opt.label}
        </button>
      ))}
    </div>
  );
}
function ReportRow({ label, value, sub, emphasis, tone }) {
  const toneColor = tone === 'good' ? 'text-emerald-400' : tone === 'bad' ? 'text-rose-400' : 'text-stone-100';
  return (
    <div className="flex items-baseline justify-between py-2.5 border-b border-stone-800/70 last:border-0">
      <div><div className="text-[13px] text-stone-400">{label}</div>{sub && <div className="text-[11px] text-stone-600 mt-0.5">{sub}</div>}</div>
      <div className={`tabular-nums ${emphasis ? 'text-[19px] font-semibold' : 'text-[14px] font-medium'} ${toneColor}`}>{value}</div>
    </div>
  );
}

function App() {
  const [priceMode, setPriceMode] = useState('rate');
  const [unit, setUnit] = useState('sqft');
  const [size, setSize] = useState('1200');
  const [rate, setRate] = useState('8500');
  const [totalPriceInput, setTotalPriceInput] = useState('10200000');
  const [downPct, setDownPct] = useState('20');
  const [interestRate, setInterestRate] = useState('8.5');
  const [tenure, setTenure] = useState('20');
  const [monthlyRent, setMonthlyRent] = useState('22000');
  const [stampDutyPct, setStampDutyPct] = useState('7');
  const [brokeragePct, setBrokeragePct] = useState('1');
  const [annualMaintenance, setAnnualMaintenance] = useState('18000');
  const [appreciation, setAppreciation] = useState('5');
  const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

  const calc = useMemo(() => {
    const sizeSqft = num(size) * UNIT_TO_SQFT[unit];
    const basePrice = priceMode === 'rate' ? num(size) * num(rate) : num(totalPriceInput);
    const pricePerSqft = sizeSqft > 0 ? basePrice / sizeSqft : 0;
    const stampDutyAmt = (basePrice * num(stampDutyPct)) / 100;
    const brokerageAmt = (basePrice * num(brokeragePct)) / 100;
    const totalCost = basePrice + stampDutyAmt + brokerageAmt;
    const downPaymentAmt = (basePrice * num(downPct)) / 100;
    const loanAmount = Math.max(basePrice - downPaymentAmt, 0);
    const r = num(interestRate) / 12 / 100;
    const n = num(tenure) * 12;
    let emi = 0;
    if (r > 0 && n > 0) emi = (loanAmount * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
    else if (n > 0) emi = loanAmount / n;
    const totalPayment = emi * n;
    const totalInterest = totalPayment - loanAmount;
    const annualRent = num(monthlyRent) * 12;
    const grossYield = basePrice > 0 ? (annualRent / basePrice) * 100 : 0;
    const netYield = basePrice > 0 ? ((annualRent - num(annualMaintenance)) / basePrice) * 100 : 0;
    const monthlyCashFlow = num(monthlyRent) - emi - num(annualMaintenance) / 12;
    const annualCashFlow = monthlyCashFlow * 12;
    const upfrontCash = downPaymentAmt + stampDutyAmt + brokerageAmt;
    const cashOnCash = upfrontCash > 0 ? (annualCashFlow / upfrontCash) * 100 : 0;
    const futureValue = basePrice * Math.pow(1 + num(appreciation) / 100, num(tenure));
    return { basePrice, pricePerSqft, stampDutyAmt, brokerageAmt, totalCost, downPaymentAmt, loanAmount, emi, totalPayment, totalInterest, annualRent, grossYield, netYield, monthlyCashFlow, annualCashFlow, upfrontCash, cashOnCash, futureValue };
  }, [priceMode, unit, size, rate, totalPriceInput, downPct, interestRate, tenure, monthlyRent, stampDutyPct, brokeragePct, annualMaintenance, appreciation]);

  return (
    <div className="min-h-screen w-full bg-stone-950 text-stone-100">
      <div className="max-w-md mx-auto px-4 py-6 pb-14">
        <div className="flex items-center gap-2 text-amber-500 mb-1">
          <span className="text-[11px] uppercase tracking-wide font-semibold">Investment Ledger</span>
        </div>
        <h1 className="text-[26px] leading-tight text-stone-50 mb-4" style={{fontFamily:"Georgia, serif"}}>Property Calculator</h1>

        <section className="mb-5">
          <h2 className="text-[12px] font-semibold uppercase tracking-wide text-stone-500 mb-3">Property Details</h2>
          <div className="bg-stone-900/40 border border-stone-800 rounded-lg p-4 space-y-4">
            <Field label="Size unit"><SegToggle value={unit} onChange={setUnit} options={[{value:'sqft',label:'Sq Ft'},{value:'sqgaj',label:'Sq Gaj'},{value:'sqm',label:'Sq M'}]} /></Field>
            <Field label={`Property size (${UNIT_LABEL[unit]})`}><NumInput value={size} onChange={setSize} suffix={UNIT_LABEL[unit]} /></Field>
            <Field label="Price input method"><SegToggle value={priceMode} onChange={setPriceMode} options={[{value:'rate',label:'Rate per unit'},{value:'total',label:'Total price'}]} /></Field>
            {priceMode === 'rate' ? (
              <Field label={`Rate per ${UNIT_LABEL[unit]}`}><NumInput value={rate} onChange={setRate} /></Field>
            ) : (
              <Field label="Total property price"><NumInput value={totalPriceInput} onChange={setTotalPriceInput} /></Field>
            )}
          </div>
        </section>

        <section className="mb-5">
          <h2 className="text-[12px] font-semibold uppercase tracking-wide text-stone-500 mb-3">Financing</h2>
          <div className="bg-stone-900/40 border border-stone-800 rounded-lg p-4 space-y-4">
            <Field label="Down payment"><NumInput value={downPct} onChange={setDownPct} suffix="%" /></Field>
            <Field label="Loan interest rate"><NumInput value={interestRate} onChange={setInterestRate} suffix="% p.a." /></Field>
            <Field label="Loan tenure"><NumInput value={tenure} onChange={setTenure} suffix="years" /></Field>
          </div>
        </section>

        <section className="mb-5">
          <h2 className="text-[12px] font-semibold uppercase tracking-wide text-stone-500 mb-3">Rental Income & Extra Costs</h2>
          <div className="bg-stone-900/40 border border-stone-800 rounded-lg p-4 space-y-4">
            <Field label="Expected monthly rent"><NumInput value={monthlyRent} onChange={setMonthlyRent} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Stamp duty + reg."><NumInput value={stampDutyPct} onChange={setStampDutyPct} suffix="%" /></Field>
              <Field label="Brokerage"><NumInput value={brokeragePct} onChange={setBrokeragePct} suffix="%" /></Field>
            </div>
            <Field label="Annual maintenance / tax"><NumInput value={annualMaintenance} onChange={setAnnualMaintenance} /></Field>
            <Field label="Expected annual appreciation"><NumInput value={appreciation} onChange={setAppreciation} suffix="% p.a." /></Field>
          </div>
        </section>

        <section>
          <h2 className="text-[12px] font-semibold uppercase tracking-wide text-amber-500 mb-3">Report</h2>
          <div className="bg-gradient-to-b from-stone-900 to-stone-900/60 border border-amber-500/20 rounded-lg p-4 mb-4">
            <div className="text-[12px] text-stone-500 mb-1">Total Property Cost</div>
            <div className="text-[28px] font-semibold text-amber-400" style={{fontFamily:"Georgia, serif"}}>{formatINR(calc.totalCost)}</div>
          </div>
          <div className="bg-stone-900/40 border border-stone-800 rounded-lg px-4 mb-4">
            <ReportRow label="Price per sq ft" value={formatFull(calc.pricePerSqft)} />
            <ReportRow label="Down payment" value={formatINR(calc.downPaymentAmt)} />
            <ReportRow label="Loan amount" value={formatINR(calc.loanAmount)} />
            <ReportRow label="Monthly EMI" value={formatFull(calc.emi)} emphasis />
            <ReportRow label="Total interest" value={formatINR(calc.totalInterest)} />
            <ReportRow label="Cash needed upfront" value={formatINR(calc.upfrontCash)} />
          </div>
          <div className="bg-stone-900/40 border border-stone-800 rounded-lg px-4 mb-4">
            <ReportRow label="Gross rental yield" value={calc.grossYield.toFixed(2) + '%'} emphasis tone="good" />
            <ReportRow label="Net rental yield" value={calc.netYield.toFixed(2) + '%'} />
            <ReportRow label="Monthly cash flow" value={formatFull(calc.monthlyCashFlow)} tone={calc.monthlyCashFlow >= 0 ? 'good' : 'bad'} />
            <ReportRow label="Cash-on-cash return" value={calc.cashOnCash.toFixed(2) + '%'} tone={calc.cashOnCash >= 0 ? 'good' : 'bad'} />
          </div>
          <div className="bg-stone-900/40 border border-stone-800 rounded-lg px-4">
            <ReportRow label={`Projected value in ${tenure||0} years`} value={formatINR(calc.futureValue)} emphasis tone="good" />
          </div>
        </section>
        <p className="text-[10.5px] text-stone-600 mt-6">Estimates only — not financial advice. Built by Naeem Malik.</p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
